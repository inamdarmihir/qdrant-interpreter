[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdrant-interpreter-plugin"
version = "0.1.0"
description = "Qdrant agent interpreter using the LangChain QuickJS sandbox pattern"
readme = "qdrant_interpreter_plugin/README.md"
requires-python = ">=3.11"
license = {text = "Educational"}
authors = [
    {name = "Anthropic", email = "support@anthropic.com"}
]
keywords = ["langchain", "langgraph", "qdrant", "agents", "interpreter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "qdrant-client>=1.9.0",
    "quickjs-rs>=0.2.0",
]

[project.optional-dependencies]
agent = [
    "deepagents[quickjs]>=0.6.0",
    "langchain-quickjs>=0.3.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "deepagents[quickjs]>=0.6.0",
    "langchain-quickjs>=0.3.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.0",
]

[tool.setuptools]
packages = ["qdrant_interpreter_plugin"]

[project.urls]
Homepage = "https://github.com/inamdarmihir/qdrant-interpreter"
Documentation = "https://github.com/inamdarmihir/qdrant-interpreter"
Repository = "https://github.com/inamdarmihir/qdrant-interpreter.git"
Issues = "https://github.com/inamdarmihir/qdrant-interpreter/issues"
