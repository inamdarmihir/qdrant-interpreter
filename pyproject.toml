[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdrant-interpreter-plugin"
version = "0.1.0"
description = "A stateful Python interpreter for LangChain/LangGraph agents with integrated Qdrant vector database support"
readme = "qdrant_interpreter_plugin/README.md"
requires-python = ">=3.10"
license = {text = "Educational"}
authors = [
    {name = "Anthropic", email = "support@anthropic.com"}
]
keywords = ["langchain", "langgraph", "qdrant", "agents", "interpreter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "qdrant-client>=1.9.0",
]

[project.optional-dependencies]
langchain = [
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0",
    "langgraph>=0.2.0",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "langchain-core>=0.2.0",
    "pydantic>=2.0",
    "langgraph>=0.2.0",
]

[tool.setuptools]
packages = ["qdrant_interpreter_plugin"]

[project.urls]
Homepage = "https://github.com/anthropics/qdrant-interpreter-plugin"
Documentation = "https://github.com/anthropics/qdrant-interpreter-plugin"
Repository = "https://github.com/anthropics/qdrant-interpreter-plugin.git"
Issues = "https://github.com/anthropics/qdrant-interpreter-plugin/issues"
